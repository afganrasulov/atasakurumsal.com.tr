name: Blog Internal Linking — Weekly

on:
  schedule:
    # Her Pazartesi 04:00 UTC (07:00 TR)
    - cron: '0 4 * * 1'
  workflow_dispatch: # Manuel tetikleme

jobs:
  internal-linking:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Run Internal Linking
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "🔗 Internal linking başlatılıyor..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "$SITE_URL/api/blog/internal-link")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "📦 HTTP Status: $HTTP_CODE"
          echo "📄 Response: $BODY"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Internal linking tamamlandı"
          else
            echo "❌ Internal linking hatası: $HTTP_CODE"
            exit 1
          fi
